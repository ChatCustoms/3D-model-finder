[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls to your backend VM
[[redirects]]
  from = "/api/*"
  to = "http://35.231.247.10:3001/api/:splat"
  status = 200
  force = true

# Keep React Router routes working
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200